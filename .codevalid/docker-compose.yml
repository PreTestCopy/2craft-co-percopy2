services:
  app:
    build:
      context: ..
      dockerfile: .codevalid/Dockerfile
    environment:
      PORT: "6713"
      DATABASE_URL: "postgresql://app:app@toxiproxy:5432/appdb"
      WAIT_FOR_TCP: "toxiproxy:5432"
      MIGRATE_CMD: "npx prisma migrate deploy"
      JWT_SECRET: "codevalid-test-secret"
    depends_on:
      toxiproxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6713/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - codevalid

  toxiproxy:
    build:
      context: ./toxiproxy
      dockerfile: Dockerfile
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:8474/version"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - codevalid

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - codevalid

  seed-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: seed-test.Dockerfile
      args:
        CACHEBUST: "${CODEVALID_CACHEBUST:-1}"
    environment:
      DATABASE_URL: "postgresql://app:app@toxiproxy:5432/appdb"
      APP_BASE_URL: "http://app:6713"
      BASE_URL: "http://app:6713"
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/bash", "tests/task_8469147088_20260901212727/api/register_buyer_success.sh"]
    networks:
      - codevalid

networks:
  codevalid:
